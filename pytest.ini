[pytest]
testpaths = tests pyatem/tests pyhyperdeck/tests
# pytest-timeout: a hung test fails instead of hanging the run.
timeout = 60
# Only tests using the ``db`` fixture / ``@pytest.mark.django_db`` touch the
# (auto-created, throwaway) test database; pyatem tests are pure Python.
DJANGO_SETTINGS_MODULE = config.settings
