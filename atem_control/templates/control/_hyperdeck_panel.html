    <!-- HyperDeck Transport Panel Overlay (OUTSIDE blurred content) -->
    <div class="fixed inset-0 z-[200]" x-show="$store.atem.hyperdeckOpen" x-cloak
         @keydown.escape.window="window.AtemHyperdeck.close()">
        <div class="absolute inset-0 bg-black/60 pointer-events-auto"
             @click="window.AtemHyperdeck.close()"
             x-transition:enter="transition-opacity ease-out duration-200"
             x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-150"
             x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>

        <div class="relative h-full flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-base-200 border border-[var(--line)] shadow-2xl rounded-xl pointer-events-auto flex flex-col w-full max-w-5xl h-[min(44rem,85vh)] overflow-hidden"
                @click.stop x-show="$store.atem.hyperdeckOpen"
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="transform scale-95 opacity-0"
                x-transition:enter-end="transform scale-100 opacity-100"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="transform scale-100 opacity-100"
                x-transition:leave-end="transform scale-95 opacity-0">

                <!-- Header -->
                <div class="flex items-center justify-between gap-3 px-6 py-4 border-b border-base-300 flex-shrink-0">
                    <div class="min-w-0">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <i class="bi bi-camera-reels text-primary"></i>
                            HyperDecks
                        </h2>
                        <div class="text-xs opacity-50 mt-0.5"
                             x-text="$store.atem.hyperdeck.decks.length + ($store.atem.hyperdeck.decks.length === 1 ? ' deck' : ' decks') + ' connected to this ATEM'"></div>
                    </div>
                    <button class="btn btn-ghost btn-sm btn-circle" @click="window.AtemHyperdeck.close()" title="Close (Esc)">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <!-- Body: deck list | selected deck -->
                <div class="flex-1 min-h-0 flex">

                    <!-- Deck list (one entry per HyperDeck bound on the ATEM) -->
                    <div class="w-64 flex-shrink-0 border-r border-base-300 overflow-y-auto p-3 space-y-2 bg-base-300/20">
                        <template x-for="d in $store.atem.hyperdeck.decks" :key="d.slot">
                            <button class="w-full text-left px-3.5 py-3 transition-colors"
                                    :class="d.network_address === $store.atem.hyperdeck.deckIp ? 'bg-primary/15 ring-1 ring-primary/60' : 'hover:bg-base-300/60'"
                                    @click="window.AtemHyperdeck.selectDeck(d.network_address)">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="w-2 h-2 rounded-full shrink-0"
                                          :class="d.online === null ? 'bg-base-content/30'
                                                  : !d.online ? 'bg-error'
                                                  : ['play','playing','forward'].includes((d.playState||'').toLowerCase()) ? 'bg-success animate-pulse'
                                                  : 'bg-success'"></span>
                                    <span class="font-medium text-sm truncate" x-text="d.name || d.network_address"></span>
                                </div>
                                <div class="text-xs opacity-50 mt-1 truncate" x-text="d.network_address"></div>
                                <div class="flex items-center gap-1.5 mt-1.5">
                                    <span class="badge badge-ghost badge-xs" x-text="'Input ' + d.input"></span>
                                    <span class="text-[11px] capitalize"
                                          :class="d.online === false ? 'text-error' : 'opacity-50'"
                                          x-text="d.online === null ? 'checking…' : (d.online ? (d.playState || 'idle') : 'offline')"></span>
                                </div>
                            </button>
                        </template>
                        <div x-show="!$store.atem.hyperdeck.decks.length"
                             class="text-center text-sm opacity-50 py-8 px-2">
                            No HyperDecks are configured on this ATEM.
                        </div>
                    </div>

                    <!-- Selected deck -->
                    <div class="flex-1 min-w-0 flex flex-col">

                        <!-- Deck identity + SD cards -->
                        <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-base-300 flex-shrink-0">
                            <div class="text-sm min-w-0 truncate">
                                <span class="font-medium" x-text="$store.atem.hyperdeck.name || $store.atem.hyperdeck.deckIp || '—'"></span>
                                <span class="opacity-50" x-show="$store.atem.hyperdeck.model" x-text="' · ' + $store.atem.hyperdeck.model"></span>
                                <span class="opacity-50" x-show="$store.atem.hyperdeck.videoFormat" x-text="' · ' + $store.atem.hyperdeck.videoFormat"></span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <template x-for="s in $store.atem.hyperdeck.slots" :key="s.id">
                                    <span class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full"
                                          :class="s.connected ? 'bg-success/15 text-success' : 'bg-base-300 text-base-content/40'"
                                          :title="s.connected ? (s.volume || 'mounted') : 'empty'">
                                        <i class="bi" :class="s.connected ? 'bi-sd-card-fill' : 'bi-sd-card'"></i>
                                        <span x-text="s.name"></span>
                                    </span>
                                </template>
                            </div>
                        </div>

                        <!-- Now Playing + transport -->
                        <div class="px-5 pt-4 pb-3 flex-shrink-0 border-b border-base-300">
                            <div class="flex items-center justify-between gap-3 mb-2">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-1 rounded-full capitalize"
                                          :class="window.AtemHyperdeck.isPlaying() ? 'bg-success/20 text-success' : 'bg-base-300 text-base-content/60'">
                                        <span class="w-1.5 h-1.5 rounded-full"
                                              :class="window.AtemHyperdeck.isPlaying() ? 'bg-success animate-pulse' : 'bg-base-content/40'"></span>
                                        <span x-text="$store.atem.hyperdeck.transport.status || 'stopped'"></span>
                                    </span>
                                    <span class="font-medium truncate"
                                          x-text="(window.AtemHyperdeck.playingClip() || {}).name || $store.atem.hyperdeck.transport['clip name'] || 'No clip loaded'"></span>
                                </div>
                                <div class="font-mono text-sm whitespace-nowrap tabular-nums shrink-0">
                                    <span x-text="window.AtemHyperdeck.times().elapsed"></span>
                                    <span class="opacity-30"> / </span>
                                    <span class="opacity-60" x-text="window.AtemHyperdeck.times().length"></span>
                                </div>
                            </div>
                            <progress class="progress progress-primary w-full h-1.5"
                                      :value="window.AtemHyperdeck.progress()" max="100"></progress>
                            <div class="flex items-center justify-between mt-2.5">
                                <span class="text-[11px] opacity-50 font-mono tabular-nums w-24"
                                      x-text="'-' + window.AtemHyperdeck.times().remaining"></span>
                                <div class="flex items-center gap-2">
                                    <button class="btn btn-square btn-sm btn-ghost" @click="window.AtemHyperdeck.stop()" title="Stop">
                                        <i class="bi bi-stop-fill text-lg"></i>
                                    </button>
                                    <button class="btn btn-square btn-primary"
                                            @click="window.AtemHyperdeck.isPlaying() ? window.AtemHyperdeck.pause() : window.AtemHyperdeck.play()"
                                            :title="window.AtemHyperdeck.isPlaying() ? 'Pause' : 'Play'">
                                        <i class="bi text-xl" :class="window.AtemHyperdeck.isPlaying() ? 'bi-pause-fill' : 'bi-play-fill'"></i>
                                    </button>
                                    <button class="btn btn-square btn-sm" :class="$store.atem.hyperdeck.loop ? 'btn-primary' : 'btn-ghost'"
                                            @click="window.AtemHyperdeck.toggleLoop()" title="Loop the current clip">
                                        <i class="bi bi-arrow-repeat text-lg"></i>
                                    </button>
                                </div>
                                <span class="w-24"></span>
                            </div>
                        </div>

                        <!-- Error -->
                        <div x-show="$store.atem.hyperdeck.error"
                             class="mx-5 mt-2 px-3 py-2 text-sm text-error bg-error/10 rounded-lg flex items-center gap-2 flex-shrink-0">
                            <i class="bi bi-exclamation-triangle"></i>
                            <span x-text="$store.atem.hyperdeck.error"></span>
                        </div>

                        <!-- Clips -->
                        <div class="px-5 pb-1 pt-3 flex items-center justify-between flex-shrink-0">
                            <h3 class="text-xs font-semibold uppercase tracking-wide opacity-60">Clips</h3>
                            <span class="text-xs opacity-50" x-show="$store.atem.hyperdeck.clips.length"
                                  x-text="$store.atem.hyperdeck.clips.length + ($store.atem.hyperdeck.clips.length === 1 ? ' clip' : ' clips')"></span>
                        </div>
                        <div class="flex-1 min-h-0 overflow-y-auto px-3 pb-3">
                            <div x-show="$store.atem.hyperdeck.loading && !$store.atem.hyperdeck.clips.length"
                                 class="flex items-center gap-2 justify-center py-10 opacity-70">
                                <span class="loading loading-spinner loading-sm"></span> Loading clips…
                            </div>
                            <div x-show="!$store.atem.hyperdeck.loading && !$store.atem.hyperdeck.clips.length"
                                 class="flex flex-col items-center gap-2 opacity-50 py-12">
                                <i class="bi bi-collection text-3xl"></i>
                                <span>No clips on this deck.</span>
                            </div>
                            <div class="space-y-0.5">
                                <template x-for="c in $store.atem.hyperdeck.clips" :key="c.slot + '-' + c.clip_id">
                                    <div class="group flex items-center gap-3 px-3 py-2"
                                         :class="window.AtemHyperdeck.isClipPlaying(c) ? 'bg-primary/10' : 'hover:bg-base-300/50'">
                                        <i class="bi bi-play-fill text-primary shrink-0 w-4 text-center"
                                           :class="window.AtemHyperdeck.isClipPlaying(c) ? '' : 'invisible'"></i>
                                        <span class="flex-1 truncate text-sm" x-text="c.name"></span>
                                        <span class="badge badge-ghost badge-sm shrink-0" x-text="c.slot_name"></span>
                                        <span class="font-mono text-xs opacity-50 tabular-nums shrink-0" x-text="c.duration"></span>
                                        <div class="flex gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button class="btn btn-xs btn-ghost btn-square" @click="window.AtemHyperdeck.cueClip(c)" title="Cue (go to clip, no play)"><i class="bi bi-skip-start-fill"></i></button>
                                            <button class="btn btn-xs btn-primary btn-square" @click="window.AtemHyperdeck.playClip(c)" title="Play this clip"><i class="bi bi-play-fill"></i></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
