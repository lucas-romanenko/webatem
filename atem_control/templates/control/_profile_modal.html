    <!-- Profile Save / Load Section Selection Modal -->
    <!-- One markup tree, two modes (save / load) controlled by profileDialogMode. -->
    <!-- All file handling delegated to window.AtemProfile (atem_profile.js): -->
    <!-- sequential <a download> for save, <input type="file"> pickers for load. -->
    <div class="fixed inset-0 z-[300]" x-show="profileDialogOpen" x-cloak
         @keydown.escape.window="if (!profileBusy) profileDialogOpen = false">
        <div class="atem-overlay-backdrop absolute inset-0"
             @click="if (!profileBusy) profileDialogOpen = false"
             x-transition:enter="transition-opacity ease-out duration-200"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"></div>

        <div class="relative h-full flex items-center justify-center p-4 pointer-events-none">
            <div class="card bg-base-200 w-full max-w-3xl max-h-[90vh] flex flex-col pointer-events-auto"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100">
                <div class="card-body flex flex-col flex-1 min-h-0 overflow-hidden">
                    <!-- Header -->
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="card-title text-lg gap-2">
                            <i :class="profileDialogMode === 'save' ? 'bi bi-download' : 'bi bi-upload'"></i>
                            <span x-text="profileDialogTitle"></span>
                        </h3>
                        <button class="btn btn-ghost btn-sm" @click="profileDialogOpen = false"
                                :disabled="profileBusy">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <!-- Helper-text -->
                    <p class="text-sm text-base-content/70 mb-3"
                       x-text="profileDialogMode === 'save'
                               ? 'Pick which sections to capture. The XML and any captured media-pool images will be downloaded to your Downloads folder. Drop the XML in any folder and create an ATEM Media Pool subfolder containing the images for ATEM Software Control compatibility.'
                               : 'Pick which sections to restore. Program / Preview are off by default to avoid an unintended on-air cut. After clicking Restore you may be prompted to pick the matching media-pool image files.'"></p>

                    <!-- Media-pool capture progress (save only, while capture
                         in flight). Populated by ATEMConsumer's
                         profile_capture_progress WS message. Renders bar +
                         "Captured X of Y — Slot N (name)" line. Cache hits
                         pass through with from_cache=true and complete
                         instantly so the bar steps in chunks. State on
                         $store.atem so the WS handler writes the same
                         object the template reads. -->
                    <div x-show="profileDialogMode === 'save' && $store.atem.profileCaptureProgress"
                         class="mb-3 p-3 bg-base-200 rounded">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm font-medium">
                                Captured
                                <span x-text="$store.atem.profileCaptureProgress && $store.atem.profileCaptureProgress.completed"></span>
                                of
                                <span x-text="$store.atem.profileCaptureProgress && $store.atem.profileCaptureProgress.total"></span>
                                slots
                            </span>
                            <span class="text-xs text-base-content/60"
                                  x-show="$store.atem.profileCaptureProgress && $store.atem.profileCaptureProgress.from_cache"
                                  >cached</span>
                        </div>
                        <!-- Custom progress bar instead of <progress> so the
                             fill tweens smoothly between updates. The native
                             progress element doesn't take CSS transitions on
                             its value attribute reliably across browsers. -->
                        <div class="w-full bg-base-300 h-2 overflow-hidden">
                            <div class="bg-primary h-full transition-all duration-500 ease-out"
                                 :style="`width: ${$store.atem.profileCaptureProgress
                                          ? Math.min(100, ($store.atem.profileCaptureProgress.completed
                                              / Math.max($store.atem.profileCaptureProgress.total, 1)) * 100)
                                          : 0}%`">
                            </div>
                        </div>
                        <div class="text-xs text-base-content/60 mt-1"
                             x-show="$store.atem.profileCaptureProgress && $store.atem.profileCaptureProgress.slot_name">
                            Last slot:
                            <span x-text="$store.atem.profileCaptureProgress && (
                                'Slot ' + (($store.atem.profileCaptureProgress.slot || 0) + 1)
                                + ($store.atem.profileCaptureProgress.slot_name
                                   ? ' — ' + $store.atem.profileCaptureProgress.slot_name : ''))"></span>
                        </div>
                    </div>

                    <!-- Loading-state when descriptor not loaded yet -->
                    <div x-show="!profileDescriptor" class="flex items-center gap-3 py-8 justify-center">
                        <span class="loading loading-spinner loading-md"></span>
                        <span x-text="profileBusyMessage || 'Loading sections…'"></span>
                    </div>

                    <!-- Section list (renders once descriptor loaded) -->
                    <div x-show="profileDescriptor" class="flex-1 min-h-0 overflow-y-auto pr-2 -mr-2">
                        <!-- Bulk select buttons -->
                        <div class="flex gap-2 mb-2">
                            <button class="btn btn-ghost btn-xs"
                                    @click="window.AtemProfile.selectAll(profileSelections, profileDescriptor, true)"
                                    :disabled="profileBusy">Select All</button>
                            <button class="btn btn-ghost btn-xs"
                                    @click="window.AtemProfile.selectAll(profileSelections, profileDescriptor, false)"
                                    :disabled="profileBusy">Select None</button>
                            <span class="text-xs text-base-content/60 self-center"
                                  x-text="profileDescriptor && profileDescriptor.atem_name
                                          ? profileDescriptor.atem_name
                                          : (profileDescriptor && profileDescriptor.product
                                             ? profileDescriptor.product : '')"></span>
                        </div>

                        <!-- Section grid layout — Software Control–style.
                             The descriptor's ``sections`` is flat; each
                             section carries a ``group`` field that picks
                             the visual block, plus ``me_tab`` for sections
                             inside an M/E tab box. The four group blocks
                             below render in fixed order.
                             ``window.AtemProfile.sectionsInGroup`` /
                             ``sectionsInMeTab`` / ``meTabs`` come from
                             ``static/js/atem_profile.js``. -->

                        <!-- ===== Switcher group ===== -->
                        <div class="mb-3">
                            <div class="font-semibold text-sm uppercase tracking-wide text-base-content/70 mb-1">Switcher</div>

                            <!-- M/E tabs — horizontal strip, always 4
                                 (ATEM platform ceiling), one per
                                 descriptor.me_tabs entry {index,
                                 available, reason}. Clicking an
                                 available tab shows its section panel
                                 below; tabs beyond the connected
                                 switcher's me_count — and, on load,
                                 tabs whose MixEffectBlock isn't in the
                                 file — come back available=false and
                                 render greyed/inert (click is a no-op).
                                 Each tab carries a tri-state master
                                 checkbox for that M/E's selectable
                                 sections (checked = all, indeterminate
                                 = some); state sync runs in an x-effect
                                 so indeterminate tracks per-section
                                 changes even on background tabs. The
                                 Select All / Select None buttons above
                                 the Switcher group act on every M/E
                                 (and the globals), not just the active
                                 tab. -->
                            <div class="flex items-end gap-1">
                                <template x-for="tab in window.AtemProfile.meTabs(profileDescriptor)" :key="'me_' + tab.index">
                                    <div role="tab"
                                         class="px-3 py-1.5 rounded-t border border-base-300 border-b-0 flex items-center gap-2
                                                text-xs font-semibold uppercase tracking-wide select-none"
                                         :class="!tab.available
                                                 ? 'opacity-50 cursor-not-allowed bg-base-200 text-base-content/50'
                                                 : (profileActiveMeTab === tab.index
                                                    ? 'bg-primary/10 text-primary cursor-pointer'
                                                    : 'bg-base-200 text-base-content/70 hover:bg-base-100 cursor-pointer')"
                                         :title="!tab.available ? (tab.reason || 'Not available') : 'Show M/E ' + (tab.index + 1) + ' sections'"
                                         @click="if (tab.available && !profileBusy) profileActiveMeTab = tab.index">
                                        <input type="checkbox" class="checkbox checkbox-xs"
                                               :disabled="!tab.available || profileBusy"
                                               :title="'Select / deselect all M/E ' + (tab.index + 1) + ' sections'"
                                               x-effect="window.AtemProfile.syncMeTabCheckbox($el, profileDescriptor, profileSelections, tab.index)"
                                               @change="window.AtemProfile.toggleMeTab(profileDescriptor, profileSelections, tab.index, $event.target.checked)">
                                        <span x-text="'M/E ' + (tab.index + 1)"></span>
                                    </div>
                                </template>
                            </div>
                            <!-- Active M/E panel. 3 rows × N columns laid
                                 out column-major so the natural descriptor
                                 order (Program/Preview/NextTransition/
                                 TransitionStyle/FadeToBlack/USK1-k) maps
                                 to Software Control's grid:
                                 Col 1 = Program / Preview / NextTransition
                                 Col 2 = TransitionStyle / FadeToBlack / USK1
                                 Col 3 = USK2 / USK3 / USK4 -->
                            <div class="bg-base-100 rounded-b rounded-tr border border-base-300 mb-2">
                                <div x-show="window.AtemProfile.meTab(profileDescriptor, profileActiveMeTab)?.available"
                                     class="p-2 grid grid-cols-1 sm:grid-cols-3 grid-flow-row sm:grid-flow-col sm:grid-rows-3 gap-x-3 gap-y-1">
                                    <template x-for="section in window.AtemProfile.sectionsInMeTab(profileDescriptor, profileActiveMeTab)" :key="section.id">
                                        <label class="label cursor-pointer justify-start gap-2 py-1"
                                               :class="!section.supported ? 'opacity-50 cursor-not-allowed' : ''"
                                               :title="!section.supported ? (section.reason || 'Not yet supported in this version') : (section.reason || '')">
                                            <input type="checkbox" class="checkbox checkbox-sm"
                                                   :disabled="!section.supported || profileBusy"
                                                   :checked="profileSelections[section.id]"
                                                   @change="profileSelections[section.id] = $event.target.checked">
                                            <span class="text-sm" x-text="section.label"></span>                                        </label>
                                    </template>
                                </div>
                                <div x-show="!window.AtemProfile.meTab(profileDescriptor, profileActiveMeTab)?.available"
                                     class="p-2 text-xs text-base-content/50"
                                     x-text="window.AtemProfile.meTab(profileDescriptor, profileActiveMeTab)?.reason || 'Not available.'"></div>
                            </div>

                            <!-- Switcher-global row: DSK, CG, Camera Control,
                                 Audio Mixer. Siblings of the M/E box, not
                                 inside it. -->
                            <div class="bg-base-100 rounded p-2 grid grid-cols-1 sm:grid-cols-3 gap-x-3 gap-y-1">
                                <template x-for="section in window.AtemProfile.sectionsInGroup(profileDescriptor, 'switcher_global')" :key="section.id">
                                    <label class="label cursor-pointer justify-start gap-2 py-1"
                                           :class="!section.supported ? 'opacity-50 cursor-not-allowed' : ''"
                                           :title="!section.supported ? (section.reason || 'Not yet supported in this version') : (section.reason || '')">
                                        <input type="checkbox" class="checkbox checkbox-sm"
                                               :disabled="!section.supported || profileBusy"
                                               :checked="profileSelections[section.id]"
                                               @change="profileSelections[section.id] = $event.target.checked">
                                        <span class="text-sm" x-text="section.label"></span>                                    </label>
                                </template>
                            </div>
                        </div>

                        <!-- ===== Other groups (Media / IO / Others) ===== -->
                        <template x-for="grp in [
                            {id: 'media',  title: 'Media'},
                            {id: 'io',     title: 'Input and Output'},
                            {id: 'others', title: 'Others'}
                        ]" :key="grp.id">
                            <div class="mb-3" x-show="window.AtemProfile.sectionsInGroup(profileDescriptor, grp.id).length">
                                <div class="font-semibold text-sm uppercase tracking-wide text-base-content/70 mb-1"
                                     x-text="grp.title"></div>
                                <div class="bg-base-100 rounded p-2 grid grid-cols-1 sm:grid-cols-3 gap-x-3 gap-y-1">
                                    <template x-for="section in window.AtemProfile.sectionsInGroup(profileDescriptor, grp.id)" :key="section.id">
                                        <label class="label cursor-pointer justify-start gap-2 py-1"
                                               :class="!section.supported ? 'opacity-50 cursor-not-allowed' : ''"
                                               :title="!section.supported ? (section.reason || 'Not yet supported in this version') : (section.reason || '')">
                                            <input type="checkbox" class="checkbox checkbox-sm"
                                                   :disabled="!section.supported || profileBusy"
                                                   :checked="profileSelections[section.id]"
                                                   @change="profileSelections[section.id] = $event.target.checked">
                                            <span class="text-sm" x-text="section.label"></span>                                        </label>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Result panel (apply outcome) -->
                        <div x-show="profileApplyResult" class="text-xs mt-3">
                            <div x-show="profileApplyResult && profileApplyResult.error"
                                 class="alert alert-error text-xs">
                                <span class="font-semibold">Error:</span>
                                <span x-text="profileApplyResult && profileApplyResult.error"></span>
                            </div>
                            <div x-show="profileApplyResult && (profileApplyResult.applied || []).length"
                                 class="text-success">
                                <span class="font-semibold">Applied:</span>
                                <span x-text="((profileApplyResult && profileApplyResult.applied) || []).join(', ')"></span>
                            </div>
                            <div x-show="profileApplyResult && (profileApplyResult.skipped || []).length"
                                 class="text-base-content/70 mt-1">
                                <span class="font-semibold">Skipped:</span>
                                <span x-text="((profileApplyResult && profileApplyResult.skipped) || []).join('; ')"></span>
                            </div>
                            <div x-show="profileApplyResult && (profileApplyResult.errors || []).length"
                                 class="text-error mt-1">
                                <span class="font-semibold">Errors:</span>
                                <span x-text="((profileApplyResult && profileApplyResult.errors) || []).join('; ')"></span>
                            </div>
                            <div x-show="profileApplyResult && profileApplyResult.images
                                         && (profileApplyResult.images.uploaded
                                             || (profileApplyResult.images.missing || []).length
                                             || (profileApplyResult.images.upload_errors || []).length)"
                                 class="mt-1 text-base-content/70">
                                <span class="font-semibold">Images:</span>
                                <span x-text="(profileApplyResult && profileApplyResult.images && profileApplyResult.images.uploaded) || 0"></span>
                                uploaded
                                <span x-show="profileApplyResult && profileApplyResult.images && (profileApplyResult.images.missing || []).length">
                                    , missing
                                    <span x-text="((profileApplyResult && profileApplyResult.images && profileApplyResult.images.missing) || []).join(', ')"></span>
                                </span>
                                <span x-show="profileApplyResult && profileApplyResult.images && (profileApplyResult.images.upload_errors || []).length"
                                      class="text-error">
                                    ,
                                    <span x-text="((profileApplyResult && profileApplyResult.images && profileApplyResult.images.upload_errors) || []).join('; ')"></span>
                                </span>
                            </div>
                            <div x-show="profileApplyResult && profileApplyResult.savedFiles"
                                 class="alert alert-success text-xs mt-2">
                                <i class="bi bi-check-circle"></i>
                                <span x-text="(profileApplyResult && profileApplyResult.savedFiles) || ''"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer / actions -->
                    <div class="card-actions justify-end mt-3 pt-2 border-t border-base-300">
                        <!-- Footer status. Once the capture progress hits
                             completed === total, the backend is in the
                             post-capture phase (ZIP assembly + response
                             stream); switch the message to reflect that. -->
                        <span x-show="profileBusy" class="text-xs text-base-content/60 mr-auto self-center"
                              x-text="($store.atem.profileCaptureProgress
                                       && $store.atem.profileCaptureProgress.total > 0
                                       && $store.atem.profileCaptureProgress.completed
                                          >= $store.atem.profileCaptureProgress.total)
                                      ? 'Saving XML file…'
                                      : profileBusyMessage"></span>
                        <!-- While a save is capturing media-pool images
                             (profileBusy + a live capture session), Cancel
                             aborts the capture (L10) instead of being inert.
                             Otherwise it closes the dialog. -->
                        <button class="btn btn-ghost"
                                x-show="!(profileBusy && $store.atem.profileCaptureSession
                                          && profileDialogMode === 'save')"
                                @click="profileDialogOpen = false"
                                :disabled="profileBusy">Cancel</button>
                        <button class="btn btn-warning"
                                x-show="profileBusy && $store.atem.profileCaptureSession
                                        && profileDialogMode === 'save'"
                                @click="window.AtemProfile.cancelSave($data)">
                            Cancel capture</button>
                        <button class="btn btn-primary"
                                :disabled="profileBusy || !profileDescriptor"
                                @click="window.AtemProfile.runDialog($store.atem.currentIP, $data)">
                            <span x-show="!profileBusy"
                                  x-text="profileDialogMode === 'save' ? 'Save' : 'Restore'"></span>
                            <span x-show="profileBusy" class="loading loading-spinner loading-sm"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
