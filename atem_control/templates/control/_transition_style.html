                <!-- Transition Styles -->
                <div class="card bg-base-200">
                    <div class="card-body">
                        <h2 class="card-title mb-2">
                            <i class="bi bi-shuffle text-primary"></i>
                            Transition Style
                        </h2>
                        <div class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-2 xl:grid-cols-3 gap-2">
                            <template x-for="(style, index) in ATEMControl.transitionStyles" :key="style.value">
                                <button 
                                    :class="$store.atem.getTransitionStyleButtonClass(style.value)"
                                    @click="$store.atem.send('set_transition_style', {style: style.value})"
                                    x-text="style.label"
                                    class="btn btn-sm transition-all duration-200 hover:scale-105 active:scale-95">
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
