                            <!-- Complete Chroma Settings - Based on ATEM Interface -->
                            <div x-show="$store.atem.getUSKType(k) === 1" class="space-y-4 pt-3">
                                
                                <!-- Settings Header -->

                                <!-- Fill Source -->
                                <div>
                                    <label class="text-sm font-medium block mb-2 opacity-70">Fill Source:</label>
                                    <select 
                                        data-pp-select class="select select-bordered select-sm w-full text-sm"
                                        :value="$store.atem.state.mes[$store.atem.activeMe].usk?.data?.[k]?.fill_source ?? 0"
                                        @change="$store.atem.setUSKFillSource(k, parseInt($event.target.value))">
                                        <template x-for="s in $store.atem.sourcesFor('fill')" :key="s.source">
                                            <option :value="s.source" x-text="s.long"></option>
                                        </template>
                                    </select>
                                </div>
                                
                                <!-- Divider -->
                                <div class="divider my-3"></div>
                                
                                <!-- Fixed Chroma Sample Section for USK.
                                     Per-instance component: each x-for iteration gets its
                                     own copy of this x-data, and `k` (the keyer index from
                                     the enclosing x-for scope) resolves both in the method
                                     bodies and in the $watch expression strings below, so
                                     every instance tracks and drives only its own keyer.
                                     init() defers the store read to $nextTick; the
                                     iteration only exists once topology (and therefore
                                     usk.data) has arrived, so the initial sync is real
                                     state, never defaults. -->
                                <div class="space-y-3" x-data="{
                                    chromaSampleEnabled: false,
                                    chromaPreviewEnabled: false,
                                    cursorX: 0.5,
                                    cursorY: 0.5,
                                    cursorSize: 0.1,
                                    isDragging: false,
                                    isSizing: false,
                                    lastUpdateTime: 0,
                                    updateThrottle: 16,
                                    sizeThrottle: null,
                                    positionThrottle: null,
                                    initialized: false,
                                    
                                    init() {
                                        this.$nextTick(() => {
                                            const atemData = $store.atem.state.mes[$store.atem.activeMe].usk?.data?.[k];
                                            if (atemData) {
                                                this.chromaSampleEnabled = atemData.chroma_sample || false;
                                                this.chromaPreviewEnabled = atemData.chroma_preview || false;
                                                this.cursorX = atemData.chroma_sample_position?.x ?? 0.5;
                                                this.cursorY = atemData.chroma_sample_position?.y ?? 0.5;
                                                this.cursorSize = atemData.chroma_sample_size ?? 0.1;
                                            }
                                            this.initialized = true;
                                        });
                                        
                                        this.$watch('$store.atem.state.mes[$store.atem.activeMe].usk.data[k].chroma_sample', (value) => {
                                            if (!this.isDragging && !this.isSizing && this.initialized) {
                                                this.chromaSampleEnabled = value || false;
                                            }
                                        });
                                        
                                        this.$watch('$store.atem.state.mes[$store.atem.activeMe].usk.data[k].chroma_preview', (value) => {
                                            if (this.initialized) {
                                                this.chromaPreviewEnabled = value || false;
                                            }
                                        });
                                        
                                        this.$watch('$store.atem.state.mes[$store.atem.activeMe].usk.data[k].chroma_sample_position', (pos) => {
                                            if (pos && !this.isDragging && !this.isSizing && this.initialized) {
                                                // Drop the prior 100 ms ``lastUpdateTime`` gate — it
                                                // throttled server→local sync after every polling
                                                // snapshot and made the cursor lag external changes
                                                // (e.g. another operator moving the sample point).
                                                // The ``isDragging`` / ``isSizing`` guards already
                                                // prevent local clobbering during the active drag.
                                                this.cursorX = pos.x ?? 0.5;
                                                this.cursorY = pos.y ?? 0.5;
                                                this.lastUpdateTime = Date.now();
                                            }
                                        });
                                        
                                        this.$watch('$store.atem.state.mes[$store.atem.activeMe].usk.data[k].chroma_sample_size', (size) => {
                                            if (size !== undefined && size !== null && !this.isSizing && this.initialized) {
                                                this.cursorSize = size;
                                            }
                                        });
                                    },

                                    toggleChromaSample(enabled) {
                                        this.chromaSampleEnabled = enabled;
                                        $store.atem.send('set_usk_chroma_sample', {
                                            key_index: k,
                                            enabled: enabled
                                        });
                                    },
                                    
                                    toggleChromaPreview() {
                                        this.chromaPreviewEnabled = !this.chromaPreviewEnabled;
                                        $store.atem.send('set_usk_chroma_preview', {
                                            key_index: k,
                                            preview: this.chromaPreviewEnabled
                                        });
                                    },
                                    
                                    getConstrainedPosition(x, y, size) {
                                        // Calculate the actual square dimensions in normalized coordinates
                                        // The square maintains aspect ratio - width is affected by 16:9 aspect
                                        const squareHeight = size;
                                        const squareWidth = size * (9/16);
                                        
                                        // Calculate half dimensions for boundary checking
                                        const halfHeight = squareHeight / 2;
                                        const halfWidth = squareWidth / 2;
                                        
                                        // Constrain position so the square stays fully inside bounds
                                        // The center point can only go so far before the edge hits the boundary
                                        const minX = halfWidth;
                                        const maxX = 1 - halfWidth;
                                        const minY = halfHeight;
                                        const maxY = 1 - halfHeight;
                                        
                                        return {
                                            x: Math.max(minX, Math.min(maxX, x)),
                                            y: Math.max(minY, Math.min(maxY, y))
                                        };
                                    },
                                    
                                    updateSize(size) {
                                        this.isSizing = true;
                                        this.cursorSize = size;
                                        
                                        // Constrain position with new size
                                        const constrained = this.getConstrainedPosition(this.cursorX, this.cursorY, size);
                                        
                                        if (constrained.x !== this.cursorX || constrained.y !== this.cursorY) {
                                            this.cursorX = constrained.x;
                                            this.cursorY = constrained.y;
                                        }
                                        
                                        if (this.sizeThrottle) {
                                            clearTimeout(this.sizeThrottle);
                                        }
                                        
                                        this.sizeThrottle = setTimeout(() => {
                                            $store.atem.send('set_usk_chroma_sample_size', {
                                                key_index: k,
                                                size: size
                                            });
                                            
                                            // Send position update if it was constrained
                                            if (constrained.x !== this.cursorX || constrained.y !== this.cursorY) {
                                                setTimeout(() => {
                                                    $store.atem.send('set_usk_chroma_sample_position', {
                                                        key_index: k,
                                                        x: this.cursorX,
                                                        y: this.cursorY
                                                    });
                                                }, 50);
                                            }
                                            
                                            setTimeout(() => {
                                                this.isSizing = false;
                                            }, 300);
                                        }, 100);
                                    },
                                    
                                    get cursorStyle() {
                                        // Calculate square size maintaining aspect ratio
                                        const containerAspectRatio = 16 / 9;
                                        const sizePercent = this.cursorSize * 100;
                                        
                                        // Square height as percentage of container height
                                        const squareHeight = sizePercent;
                                        // Square width adjusted for aspect ratio
                                        const squareWidth = squareHeight / containerAspectRatio;
                                        
                                        // Position with Y inverted for display
                                        const x = this.cursorX * 100;
                                        const y = (1 - this.cursorY) * 100;
                                        
                                        return `
                                            left: ${x}%;
                                            top: ${y}%;
                                            width: ${squareWidth}%;
                                            padding-bottom: ${squareWidth}%;
                                            height: 0;
                                            transform: translate(-50%, -50%);
                                        `;
                                    },
                                    
                                    startDrag(e) {
                                        e.preventDefault();
                                        e.stopPropagation();
                                        this.isDragging = true;
                                        
                                        const rect = e.currentTarget.parentElement.getBoundingClientRect();
                                        
                                        const moveHandler = (e) => this.handleDrag(e, rect);
                                        const endHandler = () => this.endDrag(moveHandler, endHandler);
                                        
                                        document.addEventListener('mousemove', moveHandler);
                                        document.addEventListener('mouseup', endHandler);
                                        document.addEventListener('touchmove', moveHandler, { passive: false });
                                        document.addEventListener('touchend', endHandler);
                                        
                                        document.body.style.cursor = 'grabbing';
                                    },
                                    
                                    handleDrag(e, rect) {
                                        if (!this.isDragging) return;
                                        e.preventDefault();
                                        
                                        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                                        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                                        
                                        // Calculate raw position relative to container
                                        let x = (clientX - rect.left) / rect.width;
                                        let y = 1 - ((clientY - rect.top) / rect.height);
                                        
                                        // Constrain position based on current size
                                        const constrained = this.getConstrainedPosition(x, y, this.cursorSize);
                                        this.cursorX = constrained.x;
                                        this.cursorY = constrained.y;
                                        
                                        // Throttle updates
                                        const now = Date.now();
                                        if (now - this.lastUpdateTime > this.updateThrottle) {
                                            this.lastUpdateTime = now;
                                            
                                            // Direct send — the outer ``updateThrottle`` gate is the
                                            // throttle. The previous nested 50 ms setTimeout added
                                            // pure latency between move and wire send.
                                            $store.atem.send('set_usk_chroma_sample_position', {
                                                key_index: k,
                                                x: this.cursorX,
                                                y: this.cursorY,
                                            });
                                        }
                                    },
                                    
                                    endDrag(moveHandler, endHandler) {
                                        document.body.style.cursor = '';
                                        
                                        $store.atem.send('set_usk_chroma_sample_position', {
                                            key_index: k,
                                            x: this.cursorX,
                                            y: this.cursorY
                                        });
                                        
                                        setTimeout(() => {
                                            this.isDragging = false;
                                        }, 200);
                                        
                                        document.removeEventListener('mousemove', moveHandler);
                                        document.removeEventListener('mouseup', endHandler);
                                        document.removeEventListener('touchmove', moveHandler);
                                        document.removeEventListener('touchend', endHandler);
                                    },
                                    
                                    clickToPosition(e) {
                                        if (e.target.closest('.chroma-cursor') || e.target.closest('input[type=range]')) {
                                            return;
                                        }
                                        
                                        const rect = e.currentTarget.getBoundingClientRect();
                                        let x = (e.clientX - rect.left) / rect.width;
                                        let y = 1 - ((e.clientY - rect.top) / rect.height);
                                        
                                        // Constrain position based on current size
                                        const constrained = this.getConstrainedPosition(x, y, this.cursorSize);
                                        this.cursorX = constrained.x;
                                        this.cursorY = constrained.y;
                                        
                                        $store.atem.send('set_usk_chroma_sample_position', {
                                            key_index: k,
                                            x: this.cursorX,
                                            y: this.cursorY
                                        });
                                    },
                                    
                                    destroy() {
                                        if (this.sizeThrottle) clearTimeout(this.sizeThrottle);
                                        if (this.positionThrottle) clearTimeout(this.positionThrottle);
                                    }
                                }" x-on:destroy="destroy()">
                                    
                                    <!-- Controls Row -->
                                    <div class="flex items-center gap-3">
                                        <input 
                                            type="checkbox" 
                                            class="checkbox checkbox-sm"
                                            x-model="chromaSampleEnabled"
                                            @change="toggleChromaSample($event.target.checked)">
                                        <span class="text-sm font-medium">Chroma Sample</span>
                                        
                                        <!-- Color indicator -->
                                        <div class="w-6 h-6 rounded border border-base-content/30" 
                                            :style="`background-color: ${$store.atem.getChromaSampleColor(k)}`"
                                            title="Sampled Color">

                                        <button

                                            <line x1="0" y1="66.66%" x2="100%" y2="66.66%" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

                                        <!-- Square cursor -->

                                        <!-- Position display (for debugging) -->
                                        <div class="absolute bottom-2 left-2 text-xs text-white/70 bg-black/50 px-2 py-1 rounded">
                                            X: <span x-text="Math.round(cursorX * 100)"></span>% 
                                            Y: <span x-text="Math.round(cursorY * 100)"></span>%
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Divider -->
                                <div class="divider my-3"></div>
                                
                                <!-- Key Adjustments Section -->
                                <div class="space-y-3">
                                    <div class="text-sm font-medium opacity-70">Key Adjustments</div>
                                    
                                    <div class="space-y-4 pl-6">
                                        {% include 'control/_usk_slider.html' with label='Foreground' field='chroma_foreground' base='USKChromaForeground' min=0 max=1 step=0.001 scale=100 fallback=0 disp_min=0 disp_max=100 disp_step=0.1 decimals=1 suffix='%' %}
