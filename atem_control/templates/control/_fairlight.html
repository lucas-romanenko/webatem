                                                            setDynamics('expander', { enabled: true, mode: 'gate' });
                                                        }
                                                    ">
                                                Gate
                                            </button>
                                        </div>

                                        <!-- 3-column knob grid -->
                                        <div class="grid grid-cols-3 gap-2">
                                            <!-- Threshold -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-threshold',
                                                    min: -50, max: 0, step: 0.1, defaultValue: -20,
                                                    getValue: () => dynamicsBlock('expander').threshold_db ?? -50,
                                                    send: (v) => setDynamicsParam('expander', 'threshold_db', v),
                                                    format: (v) => v.toFixed(1),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-threshold', dynamicsBlock('expander').threshold_db ?? -50)">
                                                <div class="text-[10px] font-medium">Threshold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>-50</span><span>0 dB</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="-50" max="0">
                                            </div>
                                            <!-- Range -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-range',
                                                    min: 0, max: 60, step: 0.1, defaultValue: 0,
                                                    getValue: () => dynamicsBlock('expander').range_db ?? 0,
                                                    send: (v) => setDynamicsParam('expander', 'range_db', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-range', dynamicsBlock('expander').range_db ?? 0)">
                                                <div class="text-[10px] font-medium">Range</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0</span><span>60</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="0" max="60">
                                            </div>
                                            <!-- Ratio (disabled in Gate mode) -->
                                            <div class="flex flex-col items-center gap-1"
                                                 :class="expMode() === 'gate' ? 'opacity-40 pointer-events-none' : ''"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-ratio',
                                                    min: 1, max: 3, step: 0.1, defaultValue: 1.5,
                                                    getValue: () => dynamicsBlock('expander').ratio ?? 1,
                                                    send: (v) => setDynamicsParam('expander', 'ratio', v),
                                                    format: (v) => '1:' + v.toFixed(1),
                                                    parse: (s) => parseFloat(String(s).replace(/^\s*1\s*:\s*/, '')),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-ratio', dynamicsBlock('expander').ratio ?? 1)">
                                                <div class="text-[10px] font-medium">Ratio</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>1:1</span><span>1:3</span></div>
                                                <input type="text" class="audio-numinput">
                                            </div>
                                            <!-- Attack -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-attack',
                                                    min: 0.5, max: 100, step: 0.1, defaultValue: 1,
                                                    getValue: () => dynamicsBlock('expander').attack_ms ?? 0.5,
                                                    send: (v) => setDynamicsParam('expander', 'attack_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-attack', dynamicsBlock('expander').attack_ms ?? 0.5)">
                                                <div class="text-[10px] font-medium">Attack</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0.5</span><span>100 ms</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="0.5" max="100">
                                            </div>
                                            <!-- Hold -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-hold',
                                                    min: 0, max: 4000, step: 1, defaultValue: 0,
                                                    getValue: () => dynamicsBlock('expander').hold_ms ?? 0,
                                                    send: (v) => setDynamicsParam('expander', 'hold_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-hold', dynamicsBlock('expander').hold_ms ?? 0)">
                                                <div class="text-[10px] font-medium">Hold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="0" max="4000">
                                            </div>
                                            <!-- Release -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-exp-release',
                                                    min: 50, max: 4000, step: 1, defaultValue: 100,
                                                    getValue: () => dynamicsBlock('expander').release_ms ?? 50,
                                                    send: (v) => setDynamicsParam('expander', 'release_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-exp-release', dynamicsBlock('expander').release_ms ?? 50)">
                                                <div class="text-[10px] font-medium">Release</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>50</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="50" max="4000">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- ============ Compressor ============ -->
                                    <div class="card bg-base-300 p-3 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-bold text-sm">Compressor</h3>
                                            <input type="checkbox" class="toggle toggle-primary toggle-sm"
                                                   :checked="dynamicsBlock('compressor').enabled"
                                                   @change="setDynamicsParam('compressor', 'enabled', $event.target.checked)">
                                        </div>
                                        <div class="grid grid-cols-3 gap-2">
                                            <!-- Threshold -->
                                            <div class="flex flex-col items-center gap-1 col-span-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-comp-threshold',
                                                    min: -50, max: 0, step: 0.1, defaultValue: -20,
                                                    getValue: () => dynamicsBlock('compressor').threshold_db ?? -50,
                                                    send: (v) => setDynamicsParam('compressor', 'threshold_db', v),
                                                    format: (v) => v.toFixed(1),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-comp-threshold', dynamicsBlock('compressor').threshold_db ?? -50)">
                                                <div class="text-[10px] font-medium">Threshold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>-50</span><span>0 dB</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="-50" max="0">
                                            </div>
                                            <!-- empty (Compressor has no Range) -->
                                            <div></div>
                                            <!-- Ratio -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-comp-ratio',
                                                    min: 1.2, max: 20, step: 0.1, defaultValue: 2,
                                                    getValue: () => dynamicsBlock('compressor').ratio ?? 1.2,
                                                    send: (v) => setDynamicsParam('compressor', 'ratio', v),
                                                    format: (v) => v.toFixed(1) + ':1',
                                                    parse: (s) => parseFloat(String(s).replace(/\s*:\s*1\s*$/, '')),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-comp-ratio', dynamicsBlock('compressor').ratio ?? 1.2)">
                                                <div class="text-[10px] font-medium">Ratio</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>1.2:1</span><span>20:1</span></div>
                                                <input type="text" class="audio-numinput">
                                            </div>
                                            <!-- Attack -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-comp-attack',
                                                    min: 0.7, max: 100, step: 0.1, defaultValue: 5,
                                                    getValue: () => dynamicsBlock('compressor').attack_ms ?? 0.7,
                                                    send: (v) => setDynamicsParam('compressor', 'attack_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-comp-attack', dynamicsBlock('compressor').attack_ms ?? 0.7)">
                                                <div class="text-[10px] font-medium">Attack</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0.7</span><span>100 ms</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="0.7" max="100">
                                            </div>
                                            <!-- Hold -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-comp-hold',
                                                    min: 0, max: 4000, step: 1, defaultValue: 0,
                                                    getValue: () => dynamicsBlock('compressor').hold_ms ?? 0,
                                                    send: (v) => setDynamicsParam('compressor', 'hold_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-comp-hold', dynamicsBlock('compressor').hold_ms ?? 0)">
                                                <div class="text-[10px] font-medium">Hold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="0" max="4000">
                                            </div>
                                            <!-- Release -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-comp-release',
                                                    min: 50, max: 4000, step: 1, defaultValue: 100,
                                                    getValue: () => dynamicsBlock('compressor').release_ms ?? 50,
                                                    send: (v) => setDynamicsParam('compressor', 'release_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-comp-release', dynamicsBlock('compressor').release_ms ?? 50)">
                                                <div class="text-[10px] font-medium">Release</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>50</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="50" max="4000">
                                            </div>
                                        </div>
                                    </div>

                                    <!-- ============ Limiter ============ -->
                                    <div class="card bg-base-300 p-3 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-bold text-sm">Limiter</h3>
                                            <input type="checkbox" class="toggle toggle-primary toggle-sm"
                                                   :checked="dynamicsBlock('limiter').enabled"
                                                   @change="setDynamicsParam('limiter', 'enabled', $event.target.checked)">
                                        </div>
                                        <div class="grid grid-cols-3 gap-2">
                                            <!-- Threshold (centered: empty | knob | empty) -->
                                            <div></div>
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-lim-threshold',
                                                    min: -60, max: 0, step: 0.1, defaultValue: -10,
                                                    getValue: () => dynamicsBlock('limiter').threshold_db ?? -60,
                                                    send: (v) => setDynamicsParam('limiter', 'threshold_db', v),
                                                    format: (v) => v.toFixed(1),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-lim-threshold', dynamicsBlock('limiter').threshold_db ?? -60)">
                                                <div class="text-[10px] font-medium">Threshold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>-60</span><span>0 dB</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="-60" max="0">
                                            </div>
                                            <div></div>
                                            <!-- Attack -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-lim-attack',
                                                    min: 0.7, max: 30, step: 0.1, defaultValue: 5,
                                                    getValue: () => dynamicsBlock('limiter').attack_ms ?? 0.7,
                                                    send: (v) => setDynamicsParam('limiter', 'attack_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-lim-attack', dynamicsBlock('limiter').attack_ms ?? 0.7)">
                                                <div class="text-[10px] font-medium">Attack</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0.7</span><span>30 ms</span></div>
                                                <input type="number" class="audio-numinput" step="0.1" min="0.7" max="30">
                                            </div>
                                            <!-- Hold -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-lim-hold',
                                                    min: 0, max: 4000, step: 1, defaultValue: 0,
                                                    getValue: () => dynamicsBlock('limiter').hold_ms ?? 0,
                                                    send: (v) => setDynamicsParam('limiter', 'hold_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-lim-hold', dynamicsBlock('limiter').hold_ms ?? 0)">
                                                <div class="text-[10px] font-medium">Hold</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>0</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="0" max="4000">
                                            </div>
                                            <!-- Release -->
                                            <div class="flex flex-col items-center gap-1"
                                                 x-init="AudioKnob.attach($el, {
                                                    key: 'dyn-lim-release',
                                                    min: 50, max: 4000, step: 1, defaultValue: 100,
                                                    getValue: () => dynamicsBlock('limiter').release_ms ?? 50,
                                                    send: (v) => setDynamicsParam('limiter', 'release_ms', v),
                                                    format: (v) => v.toFixed(0),
                                                 })"
                                                 x-effect="AudioKnob.update('dyn-lim-release', dynamicsBlock('limiter').release_ms ?? 50)">
                                                <div class="text-[10px] font-medium">Release</div>
                                                <div class="audio-knob"><div class="audio-knob-indicator"></div></div>
                                                <div class="flex justify-between w-full text-[8px] text-base-content/40 px-1"><span>50</span><span>4s</span></div>
                                                <input type="number" class="audio-numinput" step="1" min="50" max="4000">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
