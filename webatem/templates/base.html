{% load static %}
{% load static_v %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_title }}{% endblock %}</title>

    {% block extra_css %}{% endblock %}

    <!-- Self-hosted: Tailwind + daisyUI compiled into one static stylesheet
         at build time (see Dockerfile css stage), then the theme sheet (the
         control-page look it grew out of),
         icons + fonts vendored. No external CDN — works on an air-gapped
         studio network. -->
    <link rel="stylesheet" href="{% static 'vendor/webatem.css' %}">
    <link rel="stylesheet" href="{% static_v 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <!-- The brand (docs/brand/handoff): palette, Archivo + IBM Plex Mono, the
         control-surface rules. WebATEM's own, loads last, wins. -->
    <link rel="stylesheet" href="{% static_v 'brand/brand.css' %}">

    <!-- Installed to a home screen: the manifest names it and hands over the
         icons (Android masks the maskable one to its launcher shape); the
         apple-* tags are the same thing for older iOS, which reads them
         instead. -->
    <link rel="manifest" href="{% static_v 'brand/manifest.webmanifest' %}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="{{ app_title }}">
    <meta name="apple-mobile-web-app-title" content="{{ app_title }}">
    <meta name="theme-color" content="#0E0F10">
    <link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'brand/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'brand/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- The select facade (any <select data-wa-select>) and our own scrollbar
         overlay for every scroller — both synced from upstream. -->
    <script src="{% static_v 'js/wa-select.js' %}" defer></script>
    <script src="{% static_v 'js/custom-scrollbar.js' %}" defer></script>
    <style>
        /* APP-SHELL: the window never scrolls; <main> is the scroller, so no
           gutter is ever reserved at the window edge and a modal opening
           never shifts the page. */
        html, body { height: 100%; overflow: hidden; }
        html { scrollbar-gutter: auto !important; background-color: oklch(var(--b1)); }
        main { overflow-x: hidden; overflow-y: auto; }
        body { position: relative; }               /* positioning context for main's .cbar */

        /* EVERY scroller hides its native bar — <main>, each vertical
           .overflow-y-auto / .overflow-y-scroll, each horizontal
           .overflow-x-auto / .overflow-x-scroll, both-axis .overflow-auto /
           .overflow-scroll, and data-cbar="x|y|xy" opt-ins (data-cbar="off"
           opts out). custom-scrollbar.js overlays ours on the same set. No
           native bar means no reserved gutter, so content never shifts when a
           bar appears. Firefox's scrollbar-width:none hides both axes at
           once — accepted. */
        main,
        .overflow-y-auto:not([data-cbar="off"]), .overflow-y-scroll:not([data-cbar="off"]),
        .overflow-x-auto:not([data-cbar="off"]), .overflow-x-scroll:not([data-cbar="off"]),
        .overflow-auto:not([data-cbar="off"]),   .overflow-scroll:not([data-cbar="off"]),
        [data-cbar]:not([data-cbar="off"]) { scrollbar-width: none; }
        main::-webkit-scrollbar { width: 0; height: 0; }
        .overflow-y-auto:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-y-scroll:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-auto:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-scroll:not([data-cbar="off"])::-webkit-scrollbar,
        [data-cbar=""]::-webkit-scrollbar, [data-cbar*="y"]::-webkit-scrollbar { width: 0; }
        .overflow-x-auto:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-x-scroll:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-auto:not([data-cbar="off"])::-webkit-scrollbar,
        .overflow-scroll:not([data-cbar="off"])::-webkit-scrollbar,
        [data-cbar*="x"]::-webkit-scrollbar { height: 0; }

        /* OUR OWN scrollbar — a DOM overlay per scroller (custom-scrollbar.js),
           the same grey for every user regardless of OS auto-hide
           settings. Only the thumb is interactive. */
        .cbar {
            position: absolute;
            width: 12px;
            z-index: 30;
            opacity: 0;
            transition: opacity .2s ease;
            pointer-events: none;
            border: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .cbar.is-active { opacity: 1; }
        .cbar-thumb {
            position: absolute;
            top: 0; right: 1px;
            width: 8px;
            min-height: 32px;
            border-radius: 999px;
            background: var(--text-faint, oklch(var(--p)));   /* brand: chrome grey, not the accent */
            pointer-events: auto;
            cursor: grab;
            transition: width .12s ease, background .12s ease;
        }
        .cbar:hover .cbar-thumb { width: 10px; }
        .cbar.is-dragging .cbar-thumb { width: 10px; cursor: grabbing; background: var(--text-muted, oklch(var(--p) / 0.85)); }
        .cbar-x { width: auto; height: 12px; }
        .cbar-x .cbar-thumb {
            top: auto; bottom: 1px; left: 0; right: auto;
            height: 8px; width: auto;
            min-height: 0; min-width: 32px;
            transition: height .12s ease, background .12s ease;
        }
        .cbar-x:hover .cbar-thumb, .cbar-x.is-dragging .cbar-thumb { height: 10px; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Main content -->
    <main class="container mx-auto px-4 flex-grow max-w-[3000px] overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}

    <!-- Site-wide haptic feedback for touch devices. window.haptic(ms):
         Android gets the real Vibration API; iOS Safari has none, so the
         best-effort fallback is the (unofficial, iOS 17.4+) system tick
         from toggling a switch-style checkbox inside a user gesture.
         A delegated listener gives every button tap a light tick on
         coarse-pointer (touch) devices; call window.haptic(25) directly
         for stronger gesture confirmations (e.g. long-press actions). -->
    <!-- Kept minimally styled on purpose: opacity:0 / pointer-events:none /
         label-forwarded clicks have all been reported to defeat the iOS
         switch tick on some builds. Offscreen position only; the input
         itself receives the click. -->
    <div aria-hidden="true" style="position:fixed;left:-100px;top:-100px;">
        <input id="haptic-tick" type="checkbox" switch tabindex="-1">
    </div>
    <script>
        (function () {
            var tick = document.getElementById('haptic-tick');
            window.haptic = function (ms) {
                try {
                    if (navigator.vibrate) { navigator.vibrate(ms || 10); return; }
                    if (tick) tick.click();   // synthetic — most iOS builds ignore it
                } catch (e) { /* haptics are garnish — never break the tap */ }
            };
            var coarse = window.matchMedia && matchMedia('(pointer: coarse)');
            // Android (and anything with a real Vibration API): light tick on
            // every button tap.
            document.addEventListener('click', function (e) {
                if (!coarse || !coarse.matches) return;
                if (e.target && e.target.closest &&
                    e.target.closest('button, .btn, [role="button"]')) window.haptic(10);
            }, { passive: true, capture: true });

            // iOS: synthetic switch clicks carry no haptic on current builds —
            // only a PHYSICAL tap that natively toggles a switch does. So on
            // iOS every button gets an invisible full-size <label for=switch>
            // overlay: the finger lands on the label (native toggle → real
            // haptic) and the click keeps bubbling to the button's handlers.
            // Verified semantics: JS listeners + form submits still fire; an
            // ancestor <a>'s navigation default is CONSUMED by the label, so
            // a delegated shim below restores it; label taps move focus to
            // the switch, so focus-driven UI (.dropdown) is skipped.
            if (coarse && coarse.matches && !navigator.vibrate && tick) {
                // Zero-specificity positioning context (explicit positioning
                // on a button still wins) — avoids per-element
                // getComputedStyle, which thrashed layout on 3000-button
                // pages badly enough to freeze the tab.
                var st = document.createElement('style');
                st.textContent = ':where(.hap-host){position:relative}'
                    + 'label[data-hap]{position:absolute;inset:0;cursor:inherit}';
                document.head.appendChild(st);
                var protoLabel = document.createElement('label');
                protoLabel.htmlFor = 'haptic-tick';
                protoLabel.setAttribute('data-hap', '1');
                protoLabel.setAttribute('aria-hidden', 'true');
                var enhance = function (root) {
                    if (!root.querySelectorAll) return;
                    var els = root.querySelectorAll('button, .btn, [role="button"]');
                    for (var i = 0; i < els.length; i++) {
                        var el = els[i];
                        if (el.__hap) continue;
                        el.__hap = 1;
                        if (el.closest('.dropdown')) continue;      // focus-driven
                        if (el.hasAttribute('x-text')) continue;    // Alpine wipes children
                        if (el.matches('input, select, textarea, label')) continue;
                        el.classList.add('hap-host');
                        el.appendChild(protoLabel.cloneNode());
                    }
                };
                enhance(document);
                new MutationObserver(function (muts) {
                    for (var i = 0; i < muts.length; i++) {
                        var added = muts[i].addedNodes;
                        for (var j = 0; j < added.length; j++) {
                            if (added[j].nodeType === 1) enhance(added[j]);
                        }
                    }
                }).observe(document.body, { childList: true, subtree: true });
                // Restore the <a> navigation the label consumed.
                document.addEventListener('click', function (e) {
                    var l = e.target && e.target.closest && e.target.closest('label[data-hap]');
                    if (!l || e.defaultPrevented) return;
                    var a = l.closest('a[href]');
                    if (!a) return;
                    var href = a.getAttribute('href');
                    if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
                    if (a.target === '_blank') window.open(a.href);
                    else window.location.href = a.href;
                });
            }
        })();
    </script>
</body>
</html>
