# Auto-merge Dependabot's device-library bumps once CI is green.
#
# Dependabot only watches the bmdwire packages here (dependabot.yml), so
# every pull request it opens is one of those pins. When the CI workflow
# finishes green on a Dependabot branch this merges the PR and deletes the
# branch; a red run merges nothing. The bump lands on main as one revertible
# commit; the Docker image and the desktop builds pick it up on their next
# build. Runs on workflow_run — in the default branch's context, with
# a token that may write (a Dependabot-triggered run itself has none) — and
# only for runs Dependabot itself triggered, so a branch merely NAMED
# dependabot/... by someone else does nothing.
name: Auto-merge Dependabot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch CI on main after the merge (a token-made merge starts no push run)

jobs:
  merge:
    name: Merge the Dependabot PR
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          row="$(gh pr list --repo "$REPO" --head "$BRANCH" --author 'app/dependabot' --state open \
                  --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"' | head -1)"
          pr="${row%% *}"; sha="${row#* }"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR for $BRANCH (already merged?)"; exit 0
          fi
          if [ "$sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr moved on since this run ($sha vs $HEAD_SHA); the newer run decides"; exit 0
          fi
          echo "CI green on $BRANCH@$HEAD_SHA: merging #$pr"
          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
          gh workflow run ci.yml --repo "$REPO" --ref main
