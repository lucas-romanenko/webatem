name: Desktop builds

# Builds the self-contained WebATEM desktop launcher for each OS. Run it
# by hand (Actions -> Desktop builds -> Run workflow) to get downloadable
# binaries, or push a v* tag to attach them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# The tag build creates/updates a GitHub Release, which needs write access to
# repo contents (the default GITHUB_TOKEN is read-only).
permissions:
  contents: write

# Python version used for every desktop build. The Intel-Mac job installs the
# universal2 python.org build at this exact version and runs it x86_64 under
# Rosetta; the others get it from actions/setup-python.
env:
  PY_VERSION: '3.14.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the OLDEST supported Ubuntu so the binary's glibc floor
          # is low enough to run on 22.04 LTS servers (and everything newer).
          - { os: ubuntu-22.04,   name: linux-x64,     asset: webatem-linux-x64 }
          # Both Mac binaries build on the Apple-Silicon runner: arm64 natively,
          # and Intel (x86_64) under Rosetta 2. GitHub retired the standalone
          # macos-13 Intel runners (they never scheduled — jobs queued 24h then
          # cancelled), so this is the only reliable way to ship an Intel build.
          - { os: macos-latest,   name: macos-arm64,   asset: webatem-macos-arm64.dmg, mac_arch: arm64 }
          - { os: macos-latest,   name: macos-intel,   asset: webatem-macos-intel.dmg, mac_arch: x86_64 }
          - { os: windows-latest, name: windows-x64,   asset: webatem-windows-x64-setup.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 1. Compile the Tailwind/daisyUI stylesheet (same output as the Docker
      #    css stage) so collectstatic bundles it. Node is architecture-neutral
      #    here (it only emits CSS text), so the arm64 runner is fine for both
      #    Mac builds.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CSS
        run: |
          npm ci || npm install
          npx tailwindcss -c tailwind.config.js -i styles/app.css \
            -o atem_control/static/vendor/webatem.css --minify

      # 2a. Python for every build EXCEPT the Intel-Mac one: straight from
      #     actions/setup-python. Records `PY=python` for the shared steps.
      - uses: actions/setup-python@v5
        if: matrix.mac_arch != 'x86_64'
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Select interpreter (native)
        if: matrix.mac_arch != 'x86_64'
        run: echo "PY=python" >> "$GITHUB_ENV"

      # 2b. Intel Mac: install the universal2 python.org build and drive it
      #     x86_64 through Rosetta. Every downstream step then runs `$PY` in
      #     x86_64 mode, so pip pulls x86_64 wheels, the C extension compiles
      #     x86_64, and PyInstaller freezes an x86_64 binary — no fat/universal2
      #     wheels required (Pillow ships none).
      - name: Install x86_64 Python (Rosetta)
        if: matrix.mac_arch == 'x86_64'
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/${PY_VERSION%.*}/bin/python3"
          echo "PY=arch -x86_64 $PYBIN" >> "$GITHUB_ENV"
          echo "ARCHFLAGS=-arch x86_64" >> "$GITHUB_ENV"
          arch -x86_64 "$PYBIN" -c "import platform, sys; print('interp arch:', platform.machine(), sys.version)"

      # 3. Deps + PyInstaller into that interpreter.
      - name: Install dependencies
        run: |
          $PY -m pip install --upgrade pip setuptools wheel
          $PY -m pip install -c requirements.txt ".[desktop]" pyinstaller

      # 4. bmdwire (PyPI sdist) built atemwire's mediaconvert C extension inside the
      #    pip install above with THIS build's compiler + architecture
      #    (ARCHFLAGS forces x86_64 for the Rosetta build). Prove it imports.
      - name: Check the C extension
        run: $PY -c "import atemwire.mediaconvert, hyperdeckwire; print('atemwire.mediaconvert OK')"

      # 6. Freeze into one self-contained executable. `$PY -m PyInstaller` keeps
      #    the freeze in the same interpreter/arch as everything above.
      - name: PyInstaller
        run: $PY -m PyInstaller build/desktop/webatem.spec --distpath dist --workpath build/pyi -y

      # 6b. Run what we just froze. A desktop build that cannot start is the
      #     one failure a green build hid: 0.6.4/0.6.5 shipped a Windows folder
      #     that raised on launch ("Unhandled exception in script"), because
      #     nothing here had ever executed the frozen binary. Tray and browser
      #     off, a throwaway data dir, a spare port: it must answer the connect
      #     page. The log is the app's own (a windowed build has no console).
      - name: Smoke test the frozen build
        timeout-minutes: 6
        run: |
          set +e -ux          # this step decides its own failures (GitHub's shell adds -e)
          mkdir -p smoke
          case "$RUNNER_OS" in
            Windows) APP="dist/WebATEM/webatem.exe" ;;
            macOS)   APP="dist/WebATEM.app/Contents/MacOS/webatem" ;;
            *)       APP="dist/webatem" ;;
          esac
          DATA_DIR="$PWD/smoke" WEBATEM_NO_TRAY=1 WEBATEM_NO_BROWSER=1 HOST=127.0.0.1 PORT=8899 \
            "$APP" > smoke/stdout.txt 2>&1 &
          APP_PID=$!
          ok=
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8899/atem/ && { ok=1; break; }
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 2
          done
          echo "--- the app's own log ---"; cat smoke/webatem.log 2>/dev/null || echo "(none)"
          echo "--- stdout/stderr ---";     cat smoke/stdout.txt 2>/dev/null || echo "(none)"
          kill "$APP_PID" 2>/dev/null || true
          [ -n "$ok" ] || { echo "::error::the frozen build never served /atem/"; exit 1; }
          echo "the frozen build serves /atem/"

      # 7. Package per-OS: macOS -> a signed .app in a drag-to-Applications
      #    .dmg, notarized and stapled when the Apple credentials are set
      #    (below), ad-hoc signed otherwise; Windows -> an Inno Setup
      #    installer around the app folder; Linux -> the bare binary. The
      #    Windows download was a single self-extracting exe until 0.6.3
      #    (which Chrome blocked as a virus — that shape is what heuristic
      #    scanners score worst) and then a zip, which is not how a finished
      #    application arrives.
      #
      #    macOS signing needs FIVE repository secrets, all from one Apple
      #    Developer Program membership (developer.apple.com, paid yearly):
      #      MACOS_CERT_P12        a "Developer ID Application" certificate
      #                            exported from Keychain Access as .p12,
      #                            base64-encoded (`base64 -i cert.p12`)
      #      MACOS_CERT_PASSWORD   the password given at export
      #      APPLE_ID              the Apple ID e-mail of the account
      #      APPLE_TEAM_ID         the 10-character Team ID (Membership page)
      #      APPLE_APP_PASSWORD    an app-specific password for that Apple ID
      #                            (appleid.apple.com -> Sign-In and Security)
      #    With them the .app is signed with the hardened runtime and the
      #    entitlements in build/desktop/entitlements.plist, the .dmg is
      #    submitted to Apple's notary service and the ticket stapled, so the
      #    download opens with no warning at all. Without them the build is
      #    exactly what it was: ad-hoc signed, "Open Anyway" on first launch.
      - name: Package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)
              # Confirm the frozen binary is actually the arch we intended
              # before we ship it under an arch-specific name.
              got=$(lipo -archs dist/WebATEM.app/Contents/MacOS/webatem | tr -d '[:space:]')
              want="${{ matrix.mac_arch }}"
              echo "built arch: $got (want $want)"
              [ "$got" = "$want" ] || { echo "::error::built $got but wanted $want"; exit 1; }
              if [ -n "$MACOS_CERT_P12" ]; then
                echo "Developer ID signing: certificate present"
                # A throwaway keychain holding only this certificate; the
                # runner is discarded after the job, but the password never
                # reaches the log (set -x is off in this step on purpose).
                KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
                KEYCHAIN_PW="$(openssl rand -hex 16)"
                echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
                security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
                security set-keychain-settings -lut 21600 "$KEYCHAIN"
                security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
                security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
                security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
                security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
                rm -f "$RUNNER_TEMP/cert.p12"
                IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
                [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
                echo "signing as: $IDENTITY"
                # Hardened runtime + entitlements on every Mach-O inside the
                # bundle, innermost first (--deep is deprecated and signs in
                # the wrong order for nested frameworks), then the bundle.
                find dist/WebATEM.app/Contents -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -print0 \
                  | while IFS= read -r -d '' f; do
                      file -b "$f" | grep -q 'Mach-O' || continue
                      codesign --force --options runtime --timestamp \
                        --entitlements build/desktop/entitlements.plist --sign "$IDENTITY" "$f"
                    done
                codesign --force --options runtime --timestamp \
                  --entitlements build/desktop/entitlements.plist --sign "$IDENTITY" dist/WebATEM.app
                codesign --verify --deep --strict --verbose=2 dist/WebATEM.app && echo "Developer ID signed OK"
              else
                # Ad-hoc sign so the app runs at all (Apple Silicon refuses
                # unsigned binaries). Not notarized: the first open needs
                # System Settings -> Privacy & Security -> Open Anyway.
                echo "no MACOS_CERT_P12 secret: ad-hoc signing (first open needs Open Anyway)"
                codesign --force --deep --sign - dist/WebATEM.app
                codesign --verify --deep --strict dist/WebATEM.app && echo "ad-hoc signed OK"
              fi
              mkdir -p dmgroot
              cp -R dist/WebATEM.app dmgroot/
              ln -s /Applications dmgroot/Applications
              hdiutil create -volname WebATEM -srcfolder dmgroot -ov -format UDZO "out/${{ matrix.asset }}"
              if [ -n "$MACOS_CERT_P12" ]; then
                codesign --force --timestamp --sign "$IDENTITY" "out/${{ matrix.asset }}"
                # Apple scans the disk image and everything in it; --wait
                # blocks until the verdict (a few minutes). A rejection prints
                # the log so the reason is in the run, not behind a UUID.
                if ! xcrun notarytool submit "out/${{ matrix.asset }}" --apple-id "$APPLE_ID" \
                       --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > notary.json; then
                  cat notary.json; exit 1
                fi
                cat notary.json
                status=$(python3 -c 'import json;print(json.load(open("notary.json"))["status"])')
                if [ "$status" != "Accepted" ]; then
                  id=$(python3 -c 'import json;print(json.load(open("notary.json"))["id"])')
                  xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
                  echo "::error::notarization $status"; exit 1
                fi
                # The ticket travels inside the .dmg, so Gatekeeper is happy
                # offline too (a Mac that cannot reach Apple at first open).
                xcrun stapler staple "out/${{ matrix.asset }}"
                spctl --assess --type open --context context:primary-signature -v "out/${{ matrix.asset }}" && echo "notarized and stapled OK"
              fi
              ;;
            Windows)
              # dist/WebATEM/ (webatem.exe beside its _internal folder) goes
              # into a per-user installer: Programs folder, Start menu entry,
              # an uninstaller in Settings > Installed apps, no admin prompt.
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
              [ -x "$ISCC" ] || choco install innosetup -y --no-progress
              [ -x "$ISCC" ] || ISCC=$(command -v iscc)
              version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
              # No flags: Git Bash mangles /Oout into a path and passes
              # //Oout through literally, and ISCC rejects both. The version
              # goes in a generated include instead; the output directory is
              # set inside the script.
              printf '#define MyVersion "%s"\n' "$version" > build/desktop/version.iss
              "$ISCC" build/desktop/webatem.iss
              ls -la out
              [ -f "out/${{ matrix.asset }}" ] || { echo "::error::the installer was not produced"; ls -la out; exit 1; }
              ;;
            *)
              cp dist/webatem "out/${{ matrix.asset }}"
              ;;
          esac

      # 7b. Windows: install what we just built and run THAT. The earlier
      #     smoke test proves the frozen folder works; this proves the thing
      #     the user actually receives does — silent per-user install, launch
      #     the installed exe, serve a page, then uninstall silently.
      - name: Install the installer and run what it installed
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env:
          # Git Bash rewrites any argument that starts with "/" into a
          # Windows path, so the installer received "C:/Program Files/Git/
          # VERYSILENT" instead of /VERYSILENT, did not recognise it, and
          # put up a dialog nobody could click — the hour-long hang on the
          # 1.0.0 build. (The same trap ate ISCC's flags a few hours
          # earlier.) These two switches turn that conversion off.
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set +e -ux          # this step decides its own failures (GitHub's shell adds -e)
          # Bounded anyway: a silent installer that decides to wait, waits
          # forever, and this step must not hold a runner for hours.
          timeout 180 ./out/${{ matrix.asset }} /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOCANCEL /LOG=install.log || true
          echo "--- installer log ---"; tail -25 install.log 2>/dev/null || echo "(no install log — it never got that far)"
          APP="$LOCALAPPDATA/Programs/WebATEM/webatem.exe"
          ls -la "$LOCALAPPDATA/Programs/WebATEM" | head -5
          [ -f "$APP" ] || { echo "::error::the installer did not put webatem.exe where it said"; tail -40 install.log; exit 1; }
          mkdir -p smoke2
          DATA_DIR="$PWD/smoke2" WEBATEM_NO_TRAY=1 WEBATEM_NO_BROWSER=1 HOST=127.0.0.1 PORT=8898 \
            "$APP" > smoke2/stdout.txt 2>&1 &
          APP_PID=$!
          ok=
          for i in $(seq 1 60); do
            # -o a real file, not /dev/null: with path conversion off (above)
            # Git Bash no longer maps /dev/null to NUL, and curl fails to
            # write the body it just fetched — which looked exactly like the
            # app not answering.
            curl -fsS -o smoke2/page.html http://127.0.0.1:8898/atem/ && { ok=1; break; }
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 2
          done
          echo "--- installed app output ---"
          cat smoke2/stdout.txt 2>/dev/null || true
          cat smoke2/webatem.log 2>/dev/null || true
          # taskkill, not kill: a bash signal does not reliably end a native
          # Windows process, and the uninstaller then waits on it.
          # single slashes here too, for the same reason
          taskkill /F /IM webatem.exe /T >/dev/null 2>&1 || true
          sleep 2
          # Uninstalling must take the user's data with it. Plant the data
          # folder the app would have written, then prove it is gone.
          mkdir -p "$LOCALAPPDATA/WebATEM" && echo '{"host": "127.0.0.1"}' > "$LOCALAPPDATA/WebATEM/server.json"
          timeout 120 "$LOCALAPPDATA/Programs/WebATEM/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || true
          sleep 5
          if [ -e "$LOCALAPPDATA/WebATEM" ]; then
            echo "::error::uninstalling left the data folder behind"; ls -la "$LOCALAPPDATA/WebATEM"; exit 1
          fi
          echo "uninstall took the data folder with it"
          [ -n "$ok" ] || { echo "::error::the INSTALLED app never served /atem/"; exit 1; }
          echo "installed, ran, served $(wc -c < smoke2/page.html) bytes of the connect page"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

      # On a v* tag, attach the binaries to the Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
