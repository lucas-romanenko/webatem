# Dependabot opens a pull request when atemwire or hyperdeckwire
# (github.com/lucas-romanenko/bmdwire) publishes a new version on PyPI; CI
# builds the image and runs the suite on it; dependabot-automerge.yml merges
# it when CI is green. Scoped to those two on purpose: everything else in
# pyproject.toml is bumped by hand. Grouped, so a bmdwire release that
# touches both is one PR.
# Dependabot re-checks PyPI whenever this file changes (and daily): edit
# it to force a check.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: atemwire
      - dependency-name: hyperdeckwire
    groups:
      bmdwire:
        patterns:
          - atemwire
          - hyperdeckwire
    # Dependabot holds new versions back for 3 days by default (its
    # platform-wide cooldown). These are our own releases, published from
    # bmdwire when they are ready, so they are exempt and arrive at once.
    cooldown:
      exclude:
        - atemwire
        - hyperdeckwire
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
