[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "webatem"
version = "1.4.0"
description = "Browser-based control for Blackmagic ATEM switchers: run it, open the browser, your switchers are there"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lucas Romanenko" }]
# Everything here is a RANGE: WebATEM is also installed as a library by a
# larger Django project that pins its own versions, and an exact pin here
# would make the two unresolvable. WebATEM's own builds (the image, the
# desktop bundles, CI) are reproducible through requirements.txt, the
# exact-pin lock applied on top of these ranges. The device libraries come
# from github.com/lucas-romanenko/bmdwire, one distribution since its 1.1.0
# (atemwire and hyperdeckwire were separate PyPI projects before that).
dependencies = [
    "Django>=6.0,<7",
    "channels>=4.3,<5",
    "uvicorn[standard]>=0.30,<1",
    "pillow>=10,<14",
    "whitenoise>=6,<7",
    "zeroconf>=0.140,<1",
    "ifaddr>=0.2,<1",
    # bmdwire carries atemwire (the ATEM UDP protocol) and hyperdeckwire,
    # the two this app imports, plus two libraries it does not. A compatible
    # range, not an exact pin: a new ATEM or HyperDeck command published
    # there should reach a WebATEM install without waiting for a WebATEM
    # release, and this app only imports the packages' public surfaces,
    # which 1.x will not break. An exact pin belongs in whatever DEPLOYS
    # this (a lock file, or a host's own requirements), not here.
    "bmdwire>=1.1,<2",
]

[project.optional-dependencies]
# The menu-bar / tray launcher and its window: the downloads and pipx users
# want them; a server (Docker, or a project hosting the app) never does.
desktop = [
    "pystray>=0.19,<1",
    "pywebview>=6,<7",
]
test = [
    "pytest>=9,<10",
    "pytest-django>=4.11,<5",
    "pytest-timeout>=2.3,<3",
]

[project.scripts]
webatem = "webatem.launcher:main"

[project.urls]
Repository = "https://github.com/lucas-romanenko/webatem"
Issues = "https://github.com/lucas-romanenko/webatem/issues"

[tool.setuptools.packages.find]
include = ["webatem", "webatem.*", "atem_control", "atem_control.*"]
exclude = ["atem_control.js*"]

[tool.setuptools.package-data]
webatem = ["templates/**/*"]
atem_control = ["templates/**/*.html", "static/**/*"]
